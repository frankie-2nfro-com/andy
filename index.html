<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:light} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>With Popo Letter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one calm reading column, a letter from Lis as the opening moment, then chapters that build the job like a story. */
:root{
  --bg:#F3F3EA; --surface:#FBFBF5; --ink:#1E2A23; --muted:#56655B;
  --pandan:#2E6A48; --pandan-soft:#DCE7D3; --ginger:#B8652A; --ginger-ink:#8F4A18; --ginger-soft:#F5E2CC;
  --line:#D8D9C9; --placeholder:#E6E9DC;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151D18; --surface:#1D2721; --ink:#E8EDE4; --muted:#A5B3A8;
  --pandan:#8FCBA2; --pandan-soft:#22362A; --ginger:#E2A16A; --ginger-ink:#EDB988; --ginger-soft:#352819;
  --line:#2F3D35; --placeholder:#223029; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151D18; --surface:#1D2721; --ink:#E8EDE4; --muted:#A5B3A8;
  --pandan:#8FCBA2; --pandan-soft:#22362A; --ginger:#E2A16A; --ginger-ink:#EDB988; --ginger-soft:#352819;
  --line:#2F3D35; --placeholder:#223029; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.62; -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.wrap{max-width:640px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px}
.brand{font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:-0.01em; color:var(--pandan)}
.lang{display:flex; border:1.5px solid var(--line); border-radius:999px; padding:3px; gap:2px; background:var(--surface)}
.lang button{font:600 15px/1 var(--body); letter-spacing:0.06em; border:0; border-radius:999px; padding:10px 16px; min-height:40px; background:transparent; color:var(--muted); cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--pandan); color:var(--surface)}
button:focus-visible{outline:3px solid var(--ginger); outline-offset:2px}

/* hero */
.hero{padding-block:36px 8px}
.eyebrow{font:600 13px/1.3 var(--body); letter-spacing:0.12em; text-transform:uppercase; color:var(--ginger-ink); margin:0 0 14px}
h1{font-family:var(--display); font-weight:700; font-size:clamp(36px, 10vw, 54px); line-height:1.04; letter-spacing:-0.025em; margin:0 0 20px; text-wrap:balance}
h1 .soft{color:var(--pandan); display:block}
.lede{margin:0; color:var(--ink)}
.lede strong, .para strong{font-weight:600}

/* letter from Lis */
.letter{position:relative; margin:28px 0 12px; background:var(--surface); border:1px solid var(--line); border-radius:6px 22px 22px 22px; padding:34px 22px 22px}
.letter::before{content:"\201C"; position:absolute; top:-30px; left:14px; font:700 92px/1 var(--display); color:var(--ginger)}
.letter blockquote{margin:0; font-size:19px; line-height:1.7}
.letter .sig{display:flex; align-items:center; gap:10px; margin-top:16px; font-weight:600}
.letter .sig::before{content:""; width:28px; height:2px; background:var(--ginger)}
.letter .orig{margin-top:18px; padding-top:14px; border-top:1px dashed var(--line); font-size:15px; color:var(--muted)}
.letter .orig p{margin:6px 0 0; font-style:italic}
.note{font-size:14px; color:var(--muted); margin:0 0 20px}

/* chapters */
section.ch{padding-block:40px 8px; border-top:1px solid var(--line)}
section.ch.warm{background:var(--ginger-soft); border-top:0}
section.ch.close{background:var(--pandan-soft); border-top:0; padding-bottom:36px}
h2{font-family:var(--display); font-weight:700; font-size:clamp(27px, 7vw, 34px); line-height:1.12; letter-spacing:-0.015em; margin:0 0 10px; text-wrap:balance}
.sub{margin:0 0 16px; color:var(--muted); font-size:17px}
.paras{display:flex; flex-direction:column; gap:12px; margin-top:20px}
.para{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:6px 18px 18px 18px; padding:16px 18px 18px}
.para strong{display:block; color:var(--pandan); font-family:var(--display); font-size:19px; line-height:1.3; margin-bottom:2px}
.warm .para strong{color:var(--ginger-ink)}

/* listen */
.listen{display:inline-flex; align-items:center; gap:10px; font:600 17px/1 var(--body); color:var(--pandan); background:var(--surface); border:1.5px solid var(--pandan); border-radius:999px; padding:12px 20px 12px 14px; min-height:48px; cursor:pointer}
.listen svg{width:22px; height:22px; flex:none}
.listen[aria-pressed="true"]{background:var(--pandan); color:var(--surface)}
.listen .i-stop{display:none}
.listen[aria-pressed="true"] .i-play{display:none}
.listen[aria-pressed="true"] .i-stop{display:block}
.voice-hint{font-size:14px; color:var(--ginger-ink); margin:8px 0 0}

/* photo placeholders */
.photo{margin:22px 0 4px; aspect-ratio:16/10; max-width:100%; border-radius:18px; background:var(--placeholder); display:grid; place-items:center; text-align:center; padding:16px; color:var(--muted)}
.warm .photo{background:color-mix(in srgb, var(--surface) 55%, var(--ginger-soft))}
.photo svg{width:64px; height:64px; stroke:var(--pandan); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; margin:0 auto 10px; display:block}
.photo span{font-size:14px; letter-spacing:0.02em}

footer{padding-block:28px 40px; font-size:14px; color:var(--muted)}
footer p{margin:0 0 6px}
.draft{display:inline-block; margin-top:8px; font:600 12px/1 var(--body); letter-spacing:0.1em; text-transform:uppercase; border:1px solid var(--line); border-radius:999px; padding:6px 10px}

.lisq{display:flex; gap:12px; align-items:flex-start; margin:2px 0 6px}
.lisq .ava{width:48px; height:48px; border-radius:50%; flex:none; object-fit:cover; border:2px solid var(--ginger); margin-top:2px}
.lisq .bubble{min-width:0; flex:1; background:var(--ginger-soft); border-radius:4px 18px 18px 18px; padding:12px 16px 14px}
.warm .lisq .bubble{background:var(--surface)}
.lisq blockquote{margin:0; font-size:17px; line-height:1.6}
.lisq figcaption{margin-top:6px; font-weight:600; font-size:15px; color:var(--ginger-ink)}
.lisq .qorig{margin:8px 0 0; padding-top:8px; border-top:1px dashed var(--line); font-size:14px; font-style:italic; color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .listen, .lang button{transition:background .2s, color .2s} }

.hero-photo{margin:4px 0 22px} .ch-photo{margin:22px 0 4px} .hero-photo img{display:block; width:100%; height:auto; max-width:100%; border-radius:6px 22px 22px 22px} .hero-photo figcaption{font-size:14px; color:var(--muted); margin-top:8px}
</style>

</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand" id="brand">Bersama Popo</div>
    <div class="lang" role="group" aria-label="Language / Bahasa">
      <button type="button" id="btn-id" data-lang="id" aria-pressed="true">ID</button>
      <button type="button" id="btn-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main id="page"></main>

const LQ = {"beliefs": {"id": "di sini saya bekerja sangat nyaman, tuan   mengizinkan saya  sholat dan berpuasa, mengizinkan saya memakai kerudung di saat keluar rumah bahkan dengan keluarga saya di Indonesia anda sangat perhatian.", "en": "I work very comfortably here. Sir lets me pray and fast, and lets me wear my headscarf when I go out. You are even very caring towards my family in Indonesia."}, "sick": {"id": "ketika saya sakit, anda dan nyonya sangat cepat untuk membatu saya untuk periksa ke dokter dan mengizinkan saya untuk istirahat dan selalu mengingatkan saya untuk minum obat dan selalu menanyakan  kabar saya.", "en": "When I was sick, you and Madam quickly helped me see a doctor, let me rest, always reminded me to take my medicine and always asked how I was."}, "mood": {"id": "ketika popo sedang bad mood dan saya tidak bisa mengatasi anda dan [nama keluarga dihapus]  selalu membantu saya untuk membujuk popo dan menghibur popo supaya popo happy kembali, anda sangat membatu sekali buat saya ketika saya kesulitan mengatasi popo.", "en": "When Popo is in a bad mood and I can’t manage, you and [family name omitted] always help me coax her and cheer her up until she is happy again. You help me so much when I find Popo difficult."}, "thanks": {"id": "saya kerja di sini sangat di hargai dan sudah di anggap sebagai keluarga bukan sebagai perawat rumah tangga, itulah yang membuat saya tetap bertahan dan merasa nyaman sampai 6 tahun ini dan sebenarnya saya sangat berat untuk meninggalkan popo tapi saya harus pulang untuk menikah.\nberkerja bersama anda adalah keberuntungan bagi saya.saya bahagia selama bekerja dengan anda.terimakasih atas segala kebaikan keluarga anda terhadap saya selama ini.sukses , sehat selalu dan Tuhan memberkati kalian semua.", "en": "Here I am truly valued and treated as family, not as a domestic worker. That is what kept me here, comfortable, for six years. It is very hard to leave Popo, but I have to go home to marry. Working with you has been my good fortune. I have been happy working with you. Thank you for all your family’s kindness to me. Wishing you success and good health always, and God bless you all."}};

  lede:["Dengarkan cerita Lis.","Lis sudah enam tahun merawat ibu kami, yang biasa dipanggil Popo. Sekarang Lis akan pulang untuk menikah. Inilah ceritanya tentang bekerja dan tinggal di sini, dengan kata-katanya sendiri."],

  after:["Cerita Anda akan berbeda.","Kata-kata Lis menggambarkan pengalamannya, bukan janji bahwa setiap hari akan mudah. Anda akan mengenal Popo dengan cara Anda sendiri. Sebelum Anda memutuskan, kami ingin memperkenalkan Popo serta menjelaskan pekerjaan dan kehidupan sehari-hari di sini."],

  footer:["Halaman ini dibagikan melalui agensi yang mengurus pekerjaan ini.","Nama dan alamat sengaja tidak dicantumkan."], draft:"Draf untuk ditinjau keluarga",
  ch:[
   {h:"Popo juga pernah merantau untuk bekerja.", sub:"Kenali orangnya dulu, sebelum mengenal kebutuhan perawatannya.", photo:"memory", p:[
    ["Popo tahu rasanya bekerja keras.","Dulu Popo merantau untuk bekerja sebagai pekerja rumah tangga, lalu menikah dan membesarkan keluarga. Dulu majikannya keluarga Shanghai yang sangat teliti, sehingga Popo terbiasa dengan standar rumah tangga yang tinggi. Sampai sekarang Popo masih memperhatikan cara pekerjaan rumah dilakukan. Popo juga senang bercerita tentang masa mudanya dan bangga bisa melakukan berbagai hal sendiri."],
    ["Ingatannya berubah. Kehidupannya tetap berarti.","Popo hidup dengan demensia, penyakit yang memengaruhi ingatan, cara berpikir dan kegiatan sehari-hari—bukan sekadar lupa biasa karena bertambah usia. Kami mencari seseorang yang berpengalaman merawat orang dengan demensia, mau mengenal kesukaan Popo dan mendampinginya dengan sabar."]]},
   {h:"Makan bersama, ngobrol dan menemani Popo.", photo2:"congee", sub:"Menemani Popo adalah bagian dari pekerjaan, bukan sesuatu yang baru dilakukan setelah pekerjaan rumah selesai.", photo:"bowl", p:[
    ["Bukan hanya mengurus, tetapi juga menemani.","Saat Popo di rumah, Anda makan bersama dan ngobrol dengan Popo dalam bahasa Kanton. Karena itu, kemampuan percakapan sehari-hari dalam bahasa Kanton diperlukan sejak awal. Mendengarkan lagu kesukaan, menonton acara TV, menggambar, membuat kerajinan, serta membaca judul berita di koran atau menu bersama adalah bagian dari keseharian Popo."],
    ["Makanan yang akrab bisa membuat hari terasa nyaman.","Makanan favorit Popo di pagi hari adalah bubur nasi dengan ikan cincang, banyak jahe dan selada, dan yang paling penting, merica putih. Popo suka merica yang banyak sekali! Lis sering membuatnya. Agar-agar pandan dengan santan juga menjadi kesukaan Popo. Anda menyiapkan makanan segar yang lembut, tidak pedas, dengan sedikit minyak, garam dan gula. Anda juga belajar masakan Kanton yang biasa Popo makan dan membuat sup Cina dua sampai tiga kali seminggu. Membeli, menangani dan memasak daging babi untuk Popo termasuk dalam pekerjaan ini. Jika tugas tersebut tidak sesuai bagi Anda, beri tahu agensi sebelum pertemuan."]]},
   {h:"Popo tetap mandiri. Anda tetap dekat.", photo:"walk", sub:"Bantu sesuai kebutuhan agar Popo aman, sambil menghargai hal-hal yang masih bisa dilakukannya sendiri.", p:[
    ["Berjalan sendiri, tetap perlu pendampingan.","Popo masih berjalan sendiri, tetapi langkahnya kurang stabil. Tetap dekat, bantu bila diperlukan dan periksa keamanannya saat berjalan. Anda membantu Popo menggunakan toilet, melepas dan membersihkan gigi palsu, serta merawat kaki, kulit dan rambut. Pastikan air minum tersedia. Saat Anda merawat Popo, Popo tidak boleh ditinggal sendiri di rumah atau pergi keluar sendirian."],
    ["Popo mandi sendiri. Anda berada di dekat kamar mandi.","Popo membersihkan tubuhnya sendiri; Anda tidak memandikan Popo. Tetap di dekat kamar mandi untuk mengecek apakah Popo baik-baik saja selama mandi dan memastikan sirkulasi udara di kamar mandi baik."],
    ["Obat teratur, catatan jelas.","Anda membantu mengatur rutinitas obat Popo dan menyiapkan kotak obat sesuai jadwal yang diresepkan. Ikuti panduan tertulis yang diperiksa dokter atau apoteker serta pelatihan yang diberikan. Catat obat yang diberikan. Ukur dan catat tekanan darah pagi dan malam, lalu kirim catatan serta kabar tentang perubahan penting ke grup WhatsApp keluarga yang ditunjuk. Jangan mengubah dosis atau memutuskan pemberian obat tambahan sendiri."],
    ["Rumah terurus juga bagian dari perawatan.","Anda berbelanja bahan makanan, memasak, mencuci pakaian, serta membersihkan dapur, kamar mandi, lantai dan perlengkapan rumah. Seprai dan perlengkapan tempat tidur diganti dan dicuci setiap minggu. Pantau persediaan kebutuhan rumah serta gunakan gas, air dan listrik dengan aman dan tidak boros. Rutinitas kebersihan diri dan rumah akan dijelaskan sebelum Anda menerima pekerjaan ini."],
    ["Pelajari langkah-langkahnya bersama kami.","Anda menemani kami saat kunjungan dokter atau pemeriksaan. Setelah memahami prosesnya dan disepakati bersama, Anda mungkin mengantar Popo untuk pemeriksaan sederhana. Jika kelak Popo membutuhkan lebih banyak bantuan, misalnya mengganti popok atau menyuapi, kita membicarakan tugas, pelatihan dan dukungannya terlebih dahulu, sebelum mengubah tanggung jawab Anda."]]},
   {h:"Ada waktu untuk Popo. Ada waktu untuk Anda.", sub:"Pada hari kerja, ada waktu istirahat siang setelah pekerjaan rumah selesai, di antara tanggung jawab pagi, sore, malam dan akhir pekan.", photo:"cone", p:[
    ["Pagi mengantar, sore menyambut.","Anda membantu rutinitas pagi Popo dan berjalan bersama Popo ke tempat menunggu mobil jemputan pusat lansia. Saat Popo pulang, Anda menjemputnya, menyiapkan makanan ringan, mengecek keadaannya dari dekat kamar mandi saat Popo mandi, makan malam bersama dan membantu persiapan tidur."],
    ["Saat Popo di pusat kegiatan, ada waktu untuk Anda.","Popo biasanya mengikuti kegiatan di pusat kegiatan lansia pada siang hari, Senin sampai Jumat, dan makan siang di sana. Setelah belanja, mencuci dan pekerjaan rumah selesai, Anda bisa beristirahat, menelepon keluarga atau keluar menikmati waktu istirahat."],
    ["Akhir pekan punya rutinitas berbeda.","Saat Anda merawat Popo pada akhir pekan atau hari libur, Anda makan dan melakukan kegiatan bersama, serta pergi ke mal atau taman sesuai kondisi Popo dan kebutuhan istirahatnya. Es krim setelah jalan-jalan sudah menjadi kesukaan Popo."],
    ["Tidur Anda juga penting.","Jika Anda kebetulan sedang terjaga pada malam hari dan melihat Popo perlu ke toilet, kami menghargai bantuan Anda untuk mengantarnya dengan lembut. Anda tidak diharapkan berjaga sepanjang malam, memasang alarm atau berulang kali bangun untuk memeriksa Popo. Jika Popo sering terbangun hingga mengganggu istirahat Anda atau membutuhkan lebih banyak bantuan, beri tahu kami agar kita dapat meninjau dukungan dan pengaturan istirahat bersama."]]},
   {h:"Kamar sendiri. Kehidupan pribadi tetap ada.", q:[[1,"beliefs"]], sub:"Merawat Popo bukan berarti melepaskan hubungan dengan orang-orang terdekat, keyakinan atau minat Anda.", p:[
    ["Dekat dengan Popo, tetap terhubung dengan keluarga.","Anda tinggal bersama Popo dan memiliki kamar sendiri. Wi-Fi gratis, makanan dan minuman disediakan, serta biaya perjalanan untuk pekerjaan ditanggung keluarga. Anggota keluarga lainnya tinggal dekat, bukan di apartemen ini. Popo kadang masuk ke kamar Anda untuk mencari barang; kita perlu membicarakan bersama cara menjaga privasi Anda. Teman tidak diperbolehkan berkunjung ke apartemen."],
    ["Keyakinan dan pilihan makanan Anda dihormati.","Anda boleh memasak makanan yang Anda suka, termasuk masakan Indonesia yang disesuaikan untuk Popo jika Anda ingin menyajikannya. Kami menghormati agama dan kebutuhan ibadah Anda. Jika Anda berpuasa, kita merencanakan waktu makan, ibadah dan istirahat bersama."]]},
   {h:"Ada hari yang sulit. Kita hadapi bersama.", q:[[0,"mood"],[1,"sick"]], sub:"Kesabaran Anda perlu disertai keterlibatan dan dukungan dari kami.", cls:"warm", p:[
    ["Bagi Popo, kebingungan itu terasa nyata.","Popo mungkin bertanya berulang kali, lupa sudah makan, mencari suami atau rumah lamanya, mencurigai ada barang yang hilang, menolak bantuan atau ingin keluar. Menjelang malam, saat hujan atau cuaca mendung, Popo bisa lebih gelisah. Kadang kata-katanya menyakitkan. Memahami demensia bukan berarti Anda harus memendam perasaan saat kesulitan."],
    ["Beri tahu saat Anda membutuhkan kami.","Kami akan mengajarkan rutinitas Popo, memberikan panduan serta mengenalkan kontak keluarga utama dan cadangan. Lis akan membantu serah terima jika tersedia. Anda akan belajar kapan perlu meminta bantuan keluarga dan kapan bantuan darurat diperlukan. Ceritakan jika Anda khawatir, lelah atau merasa terluka agar kita dapat mencari dukungan yang dibutuhkan."]]},
   {h:"Sebelum Anda menerima, kami juga ingin mendengar.", q:[[1,"thanks"]], sub:"Agensi akan mengatur pertemuan. Kami ingin mendengar pertanyaan Anda, bukan hanya pengalaman Anda.", cls:"close", p:[
    ["Istirahat dan pilihan kerja dibicarakan dengan jelas.","Hari istirahat, hari libur, siapa yang mendampingi Popo saat Anda libur dan ketentuan kontrak kerja akan dijelaskan dan dibicarakan sebelum Anda menerima pekerjaan ini. Jika Anda memilihnya, bekerja pada hari Minggu dengan bayaran tambahan dapat disepakati bersama. Dianggap bagian dari keluarga tidak berarti Anda wajib bekerja pada hari Minggu."],
    ["Langkah berikutnya: ngobrol dan saling mengenal.","Agensi membagikan halaman ini kepada calon pendamping dan mengatur pertemuan dengan kami. Jika Anda tertarik bertemu, beri tahu agensi yang mengurus pekerjaan ini. Bawa pertanyaan Anda dan ceritakan pengalaman perawatan, kemampuan bahasa Kanton serta hal-hal yang masih perlu Anda pelajari atau bicarakan. Kami akan membantu Anda mempelajari ungkapan yang biasa digunakan bersama Popo. Kami juga ingin tahu apa yang Anda butuhkan agar bisa bekerja dan tinggal dengan nyaman di sini."]]}

 en:{

  eyebrow:"Live-in elderly care · Hong Kong",
  photoCap:"Lis’s birthday, celebrated with Popo.", photoAlt:"Lis and Popo smiling together behind Lis’s birthday cake",
  h1a:"Six years together.", h1b:"Why is goodbye so hard?",
  lede:["Hear it from Lis.","Lis has cared for our mother, whom everyone calls Popo, for six years. She is going home to marry; these are her own words about working and living here."],
  quote:"I have worked with you for six years, and I have been very happy working here, but I have to go home to get married. I think of Popo as my own grandmother, and I love her very much. Popo is kind and caring towards me, and I often joke with her too. Sir, Madam and [family name omitted] have been very kind to me and my family. It is honestly hard to leave Popo. When I go home, I will definitely miss Popo. I also hope that whoever replaces me will be kind to Popo and patient in caring for her.",
  origLabel:"Lis wrote this in Indonesian. Her original words:",

  after:["Your relationship will be your own.","Lis’s words tell you about her experience, not a promise that every day is easy. Here is the person you would care for, and what working and living here would mean for you."],

  footer:["This page is shared through the agency arranging this job.","Names and address are left out on purpose."], draft:"Draft for family review",
  ch:[
   {h:"She once left home for work, too.", sub:"Meet the person before learning her care needs.", photo:"memory", p:[
    ["She knows a life of hard work.","Popo once left home to work as a domestic helper, then married and raised a family. She worked for a demanding Shanghainese family, who taught her exacting standards of household care. She still notices how things are done at home. She loves telling stories about her younger days and takes pride in doing things herself."],
    ["Her memory has changed. Her life still matters.","Popo has dementia, an illness affecting memory, thinking and everyday activities—not simply ordinary forgetfulness with age. We are looking for someone with dementia-care experience who can learn her preferences and support her patiently."]]},
   {h:"Shared meals. Familiar songs. Time together.", photo2:"congee", sub:"Companionship is part of the work, not something left until the chores are finished.", photo:"bowl", p:[
    ["A place beside her, not just tasks around her.","When Popo is home, you share meals and chat with her in Cantonese, so everyday Cantonese conversation is needed. Favourite songs, TV programmes, drawing, crafts and reading newspaper headlines or menus together are part of her life."],
    ["Food can make a day feel familiar.","Popo’s morning comfort food is plain rice congee with minced fish, plenty of ginger and Chinese lettuce, and above all white pepper: she wants lots of it. Lis makes it often, and pandan jelly with coconut milk is another favourite. You prepare fresh, soft, non-spicy food with little oil, salt and sugar, learn familiar Cantonese dishes and make Chinese soup two or three times a week. Buying, handling and cooking pork for Popo is part of the role; tell the agency before the meeting if that does not suit you."]]},
   {h:"She does what she can. You stay close.", photo:"walk", sub:"Practical care keeps her safe while respecting what she can still do herself.", p:[

    ["Learn the steps with us.","You accompany us to appointments and, once familiar with the process and agreed together, may take Popo to simple check-ups. If she later needs more help, such as nappy changes or feeding assistance, we discuss the tasks, training and support before changing expectations."]]},

    ["A morning send-off. A welcome home.","Help with Popo’s morning routine and walk her to the day-centre van’s meeting point. Meet her on return, prepare a snack, monitor her bath, share dinner and help her get ready for bed."],

    ["Your sleep matters, too.","If naturally awake and you notice Popo needs the toilet, gently guiding her there is appreciated. You are not expected to stay awake, set alarms or repeatedly wake to check. Tell us if her waking disrupts your rest or she needs more help, so we can review support together."]]},
   {h:"A room of your own. A life of your own.", q:[[1,"beliefs"]], sub:"Care for Popo without giving up your own connections, beliefs and interests.", p:[
    ["Close to Popo, connected to home.","You live with Popo, with your own room, free Wi-Fi, food and drinks provided, and work travel paid. Other family members live nearby, not in the apartment. Popo sometimes enters your room looking for things; we need to address your privacy together, and friends may not visit the apartment."],

let lang = "id";
try { const s = localStorage.getItem("popo-lang"); if (s === "en" || s === "id") lang = s; } catch(e){}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const listenBtn = (key, t) => `<button type="button" class="listen" id="listen-${key}" data-key="${key}" aria-pressed="false">${ICON.play}${ICON.stop}<span>${t.listen}</span></button><p class="voice-hint" id="hint-${key}" hidden>${t.noVoice}</p>`;
const lisQuote = (k, t) => `<figure class="lisq"><img class="ava" src="${AVA}" alt="Lis" width="80" height="80"><div class="bubble"><blockquote lang="${lang}">${esc(LQ[k][lang]).replace(/\n/g,"<br>")}</blockquote><figcaption>Lis</figcaption>${lang === "en" ? `<p class="qorig" lang="id">${esc(LQ[k].id).replace(/\n/g,"<br>")}</p>` : ""}</div></figure>`;
const photo = (k, t) => REAL[k] ? `<figure class="hero-photo ch-photo"><img src="${REAL[k]}" alt="${esc(t.photos[k+"Alt"])}" width="${DIM[k][0]}" height="${DIM[k][1]}"><figcaption>${esc(t.photos[k+"Cap"])}</figcaption></figure>` : `<div class="photo" role="img" aria-label="${esc(t.photos[k])}"><div>${ICON[k]}<span>${esc(t.photos[k])}</span></div></div>`;

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("brand").textContent = t.brand;
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  let h = `<div class="wrap hero">
    <p class="eyebrow">${t.eyebrow}</p>
    <h1>${t.h1a}<span class="soft">${t.h1b}</span></h1>
    <figure class="hero-photo"><img src="${PHOTO_LIS}" alt="${t.photoAlt}" width="860" height="1199"><figcaption>${t.photoCap}</figcaption></figure>
    <p class="lede"><strong>${t.lede[0]}</strong> ${t.lede[1]}</p>
    <figure class="letter" style="margin-inline:0">
      <blockquote lang="${t.origLabel ? "en" : "id"}">${esc(t.quote)}</blockquote>
      <figcaption class="sig">Lis</figcaption>
      ${t.origLabel ? `<div class="orig">${t.origLabel}<p lang="id">${esc(LIS_ORIGINAL)}</p></div>` : ""}
    </figure>
    <p class="note">${t.note}</p>
    ${listenBtn("lis", t)}
    <p class="lede" style="margin-top:26px"><strong>${t.after[0]}</strong> ${t.after[1]}</p>
  </div>`;
  t.ch.forEach((c, i) => {
    h += `<section class="ch ${c.cls||""}" aria-labelledby="h-${i}"><div class="wrap">
      <h2 id="h-${i}">${c.h}</h2>
      <p class="sub">${c.sub}</p>
      ${listenBtn(i, t)}
      ${c.photo ? photo(c.photo, t) : ""}
      <div class="paras">${c.p.map((p, j) => `<p class="para"><strong>${p[0]}</strong>${p[1]}</p>` + (c.q||[]).filter(q => q[0] === j).map(q => lisQuote(q[1], t)).join("")).join("")}</div>
      ${c.photo2 ? photo(c.photo2, t) : ""}
    </div></section>`;
  });
  h += `<footer><div class="wrap"><p>${t.footer[0]}</p><p>${t.footer[1]}</p><span class="draft">${t.draft}</span></div></footer>`;
  document.getElementById("page").innerHTML = h;
}

/* ---- read aloud with the phone's own voice ---- */
const synth = window.speechSynthesis;
let playing = null;
function textFor(key){
  const t = T[lang];
  if (key === "lis") return [t.lede[0], t.lede[1], t.quote, "Lis."].join(" ");
  const c = t.ch[key];
  return [c.h, c.sub, ...c.p.map((p, j) => p[0] + " " + p[1] + " " + (c.q||[]).filter(q => q[0] === j).map(q => LQ[q[1]][lang] + " Lis.").join(" "))].join(" ");
}
function pickVoice(){
  if (!synth) return null;
  const want = lang === "id" ? ["id-ID","id","in-ID"] : ["en-GB","en-US","en"];
  const vs = synth.getVoices();
  for (const w of want){ const v = vs.find(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith(w.toLowerCase())); if (v) return v; }
  return null;
}
function setPressed(key, on){ const b = document.getElementById("listen-" + key); if (!b) return; b.setAttribute("aria-pressed", String(on)); b.querySelector("span").textContent = on ? T[lang].stop : T[lang].listen; }
function stopAll(){ if (synth) synth.cancel(); if (playing !== null) setPressed(playing, false); playing = null; }
function speak(key){
  const hint = document.getElementById("hint-" + key);
  if (!synth){ hint.hidden = false; return; }
  const voice = pickVoice();
  if (!voice && synth.getVoices().length) hint.hidden = false;
  stopAll();
  const parts = textFor(key).match(/[^.!?;]+[.!?;]*/g) || [];
  playing = key; setPressed(key, true);
  parts.forEach((s, i) => {
    const u = new SpeechSynthesisUtterance(s.trim());
    u.lang = lang === "id" ? "id-ID" : "en-GB"; if (voice) u.voice = voice; u.rate = 0.92;
    if (i === parts.length - 1) u.onend = () => { if (playing === key){ setPressed(key, false); playing = null; } };
    u.onerror = () => { if (playing === key){ setPressed(key, false); playing = null; } };
    synth.speak(u);
  });
}
if (synth && "onvoiceschanged" in synth) synth.onvoiceschanged = () => {};

document.addEventListener("click", e => {
  const lb = e.target.closest(".lang button");
  if (lb && lb.dataset.lang !== lang){
    stopAll(); lang = lb.dataset.lang;
    try { localStorage.setItem("popo-lang", lang); } catch(err){}
    render(); return;
  }
  const b = e.target.closest(".listen");
  if (b){ const key = b.dataset.key === "lis" ? "lis" : Number(b.dataset.key); if (playing === key) stopAll(); else speak(key); }
});

render();
</script>
